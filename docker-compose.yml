version: '3.8'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: trackdealos
      POSTGRES_PASSWORD: trackdealos
      POSTGRES_DB: trackdealos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  backend:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://trackdealos:trackdealos@db:5432/trackdealos
    depends_on:
      - db
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
volumes:
  postgres_data:
